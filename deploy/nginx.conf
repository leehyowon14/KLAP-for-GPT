# Install under nginx's http context (for example sites-enabled).
map $http_upgrade $klap_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name klap.leehyowon14.dev;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $klap_connection;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
    }
}
